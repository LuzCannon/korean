const K='kfc-v1';let S=JSON.parse(localStorage.getItem(K)||'{}');
S.p=S.p||{};S.dir=S.dir||'ke';S.cat=S.cat||'all';S.order=S.order||null;
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const $=id=>document.getElementById(id);let cur=null,flipped=false;
const cats=['all',...new Set(W.map(w=>w[4]))];
$('cat').innerHTML=cats.map(c=>`<option value="${c}">${c=='all'?'All categories':c[0].toUpperCase()+c.slice(1)} (${c=='all'?W.length:W.filter(w=>w[4]==c).length})</option>`).join('');
$('cat').value=S.cat;
// Leitner-style: box 0..5, due = review counter step
const GAP=[1,3,8,20,50,120];
if(S.step==null)S.step=0;
function pool(){return W.filter(w=>S.cat=='all'||w[4]==S.cat)}
function rank(w){if(!S.order)return w[0];return S.order[w[0]]}
function next(){
 const P=pool();let due=P.filter(w=>S.p[w[0]]&&S.p[w[0]].due<=S.step).sort((a,b)=>S.p[a[0]].due-S.p[b[0]].due);
 let c=due[0];
 if(!c){const fresh=P.filter(w=>!S.p[w[0]]).sort((a,b)=>rank(a)-rank(b));c=fresh[0];}
 if(!c){c=P.slice().sort((a,b)=>S.p[a[0]].due-S.p[b[0]].due)[0];}
 if(c&&cur&&c[0]==cur[0]&&P.length>1){const alt=due[1]||P.filter(w=>!S.p[w[0]]).sort((a,b)=>rank(a)-rank(b))[0];if(alt)c=alt}
 cur=c;flipped=false;render();
}
function render(){
 const P=pool(),seen=P.filter(w=>S.p[w[0]]),known=P.filter(w=>S.p[w[0]]&&S.p[w[0]].box>=2);
 $('stats').textContent=`Seen ${seen.length}/${P.length} · Learned ${known.length} · Due ${P.filter(w=>S.p[w[0]]&&S.p[w[0]].due<=S.step).length}`;
 $('dir').textContent=S.dir=='ke'?'KR→EN':'EN→KR';
 if(!cur){$('card').innerHTML='No cards';return}
 const [id,ko,rom,en,cat]=cur,b=S.p[id]?'Box '+S.p[id].box:'New';
 const front=S.dir=='ke'?`<div class="big">${ko}</div>`:`<div class="en" style="font-size:36px">${en}</div>`;
 const back=S.dir=='ke'?`<div class="rom">${rom}</div><div class="en">${en}</div>`:`<div class="big">${ko}</div><div class="rom">${rom}</div>`;
 $('card').innerHTML=front+(flipped?back:'<div class="hint">Tap to flip</div>')+`<div class="cat">${cat} · ${b}</div>`;
}
function grade(ok){if(!cur)return;S.step++;const p=S.p[cur[0]]||{box:0};
 p.box=ok?Math.min(p.box+1,5):0;p.due=S.step+(ok?GAP[p.box]:2);S.p[cur[0]]=p;save();next()}
$('card').onclick=()=>{flipped=!flipped;render()};
$('got').onclick=()=>grade(true);$('miss').onclick=()=>grade(false);
$('dir').onclick=()=>{S.dir=S.dir=='ke'?'ek':'ke';save();flipped=false;render()};
$('cat').onchange=e=>{S.cat=e.target.value;save();next()};
$('shuf').onclick=()=>{const ids=W.map(w=>w[0]);for(let i=ids.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ids[i],ids[j]]=[ids[j],ids[i]]}S.order={};ids.forEach((id,i)=>S.order[id]=i);save();next()};
$('reset').onclick=()=>{if(confirm('Reset all progress?')){S={p:{},dir:S.dir,cat:S.cat,step:0,order:null};save();next()}};
let voice=null;const pickV=()=>{voice=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'))||null};
if('speechSynthesis' in window){pickV();speechSynthesis.onvoiceschanged=pickV}else $('speak').style.display='none';
$('speak').onclick=()=>{if(!cur)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cur[1]);u.lang='ko-KR';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)};
next();
